spring.application.name=gateway
server.port=8080

eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=academic
spring.cloud.gateway.server.webflux.routes[0].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

springdoc.swagger-ui.disable-swagger-default-url=true

spring.cloud.gateway.server.webflux.trusted-proxies=.*

spring.cloud.gateway.server.webflux.routes[1].id=docs-academic
spring.cloud.gateway.server.webflux.routes[1].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/docs/academic
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs

springdoc.swagger-ui.urls[0].name=Academic
springdoc.swagger-ui.urls[0].url=/docs/academic