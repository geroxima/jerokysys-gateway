spring.application.name=gateway
server.port=8080

eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/login,/api/v1/users,/api/v1/users/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=academic
spring.cloud.gateway.server.webflux.routes[1].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/classes/**,/api/v1/disciplines/**,\
  /api/v1/enrollments/**,/api/v1/exams/**,/api/v1/exam-results/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[2].id=invoices
spring.cloud.gateway.server.webflux.routes[2].uri=lb://invoices
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/invoices/**,/api/v1/invoice-details/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2

springdoc.swagger-ui.disable-swagger-default-url=true

spring.cloud.gateway.server.webflux.trusted-proxies=.*

spring.cloud.gateway.server.webflux.routes[3].id=docs-auth
spring.cloud.gateway.server.webflux.routes[3].uri=lb://auth
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/auth
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[4].id=docs-academic
spring.cloud.gateway.server.webflux.routes[4].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/docs/academic
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=docs-invoices
spring.cloud.gateway.server.webflux.routes[5].uri=lb://invoices
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/docs/invoices
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs


springdoc.swagger-ui.urls[0].name=Auth
springdoc.swagger-ui.urls[0].url=/docs/auth

springdoc.swagger-ui.urls[1].name=Academic
springdoc.swagger-ui.urls[1].url=/docs/academic

springdoc.swagger-ui.urls[2].name=Invoices
springdoc.swagger-ui.urls[2].url=/docs/invoices

# ------------------------- Seguridad (JWT) -------------------------
# El gateway valida firma y vigencia del token ANTES de enrutar, y aplica las
# reglas de rol por ruta. La clave y los claims tienen que ser identicos a los
# de jerokysys-auth; viven en config/private.properties (ignorado por git).
spring.config.import=classpath:config/private.properties

jwt.secret=${JWT_SECRET}
jwt.algorithm=HS256
jwt.claim.user=username
jwt.claim.role=role

# Ningun microservicio confia en cabeceras de identidad que vengan del cliente.
spring.cloud.gateway.server.webflux.default-filters[0]=RemoveRequestHeader=X-User
spring.cloud.gateway.server.webflux.default-filters[1]=RemoveRequestHeader=X-Role
