spring.application.name=gateway
server.port=8080

eureka.instance.instance-id=${spring.application.name}:${random.uuid}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.routes[0].id=invoices
spring.cloud.gateway.server.webflux.routes[0].uri=lb://invoices
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/invoices/**,/api/v1/invoice-details/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=academic
spring.cloud.gateway.server.webflux.routes[1].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=2

springdoc.swagger-ui.disable-swagger-default-url=true

spring.cloud.gateway.server.webflux.trusted-proxies=.*

spring.cloud.gateway.server.webflux.routes[2].id=docs-academic
spring.cloud.gateway.server.webflux.routes[2].uri=lb://academic
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/docs/academic
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[3].id=docs-invoices
spring.cloud.gateway.server.webflux.routes[3].uri=lb://invoices
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/docs/invoices
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/v3/api-docs


# Services merged into the unified document at /docs/all.
# path-prefix is the gateway prefix that StripPrefix removes.
gateway.docs.services[0].service-id=academic
gateway.docs.services[0].path-prefix=/api/v1
gateway.docs.services[1].service-id=invoices
gateway.docs.services[1].path-prefix=/api/v1

# Singular url: Swagger UI loads the merged document with no service dropdown.
springdoc.swagger-ui.url=/docs/all